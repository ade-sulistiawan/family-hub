services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: familyhub
      POSTGRES_USER: familyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U familyhub"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8013:8000"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FamilyHub: Host=postgres;Port=5432;Database=familyhub;Username=familyhub;Password=${POSTGRES_PASSWORD}
      Authentication__Google__ClientId: ${GOOGLE_CLIENT_ID:-}
      Authentication__Google__ClientSecret: ${GOOGLE_CLIENT_SECRET:-}
      Notifications__Vapid__Subject: ${VAPID_SUBJECT:-mailto:admin@example.com}
      Notifications__Vapid__PublicKey: ${VAPID_PUBLIC_KEY:-}
      Notifications__Vapid__PrivateKey: ${VAPID_PRIVATE_KEY:-}

volumes:
  postgres-data:
